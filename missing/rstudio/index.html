  <script>
  (function () {
    // webR resolves its engine and package repository URLs inside its worker
    // (served from webr/v<version>/, or a blob: URL when the engine comes from
    // the CDN), never against this page. Make every relative one absolute
    // before the viewer reads the config.
    var config = window.__VIEWER_CONFIG__;
    if (!config) return;
    function absolute(url) {
      if (typeof url !== "string" || url === "" || /^[a-z][a-z0-9+.-]*:/i.test(url)) return url;
      return new URL(url, document.baseURI).href;
    }
    if (config["engine-base-url"]) config["engine-base-url"] = absolute(config["engine-base-url"]);
    var packages = config.packages;
    if (packages) {
      if (packages["repo-url"]) packages["repo-url"] = absolute(packages["repo-url"]);
      if (Array.isArray(packages.repos)) packages.repos = packages.repos.map(absolute);
    }
  })();
  </script>
  <script>
  (function () {
    var splash = document.getElementById("webrarian-loading");
    var root = document.getElementById("root");
    if (!splash || !root) return;
    var mounted = false;
    var failed = false;
    var obs = null;
    function dismiss() {
      if (mounted) return;
      mounted = true;
      if (obs) obs.disconnect();
      splash.removeAttribute("data-state");
      splash.classList.add("hidden");
    }
    function showError(message) {
      if (mounted) return;
      splash.setAttribute("data-state", "error");
      var spinner = splash.querySelector(".webrarian-spinner");
      if (spinner) spinner.style.display = "none";
      var status = document.getElementById("webrarian-status");
      if (!status) return;
      status.textContent = message + " ";
      var retry = document.createElement("button");
      retry.type = "button";
      retry.textContent = "Reload";
      retry.addEventListener("click", function () { location.reload(); });
      status.appendChild(retry);
    }
    if (root.childElementCount > 0) { dismiss(); return; }
    obs = new MutationObserver(function () {
      if (root.childElementCount > 0) dismiss();
    });
    obs.observe(root, { childList: true });
    // The viewer bundle itself failed to load: terminal.
    window.addEventListener("error", function (event) {
      var el = event.target;
      if (!mounted && el && el.tagName === "SCRIPT" && el.type === "module") {
        failed = true;
        obs.disconnect();
        showError("The viewer (" + (el.getAttribute("src") || "script") + ") could not be loaded.");
      }
    }, true);
    // Soft: say so, but keep observing, so a late mount still takes over.
    setTimeout(function () {
      if (!mounted && !failed) {
        showError("The viewer is taking longer than expected to start. Check your connection, or reload.");
      }
    }, 60000);
  })();
